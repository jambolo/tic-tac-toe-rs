[package]
name = "tic-tac-toe"
version = "0.1.0"
edition = "2024"
description = "Player-vs-computer Tic-Tac-Toe (Tauri shell)."
default-run = "tic-tac-toe"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttt-core = { path = "../src-core" }
